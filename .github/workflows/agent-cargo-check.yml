name: Agent Cargo Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cargo-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Integrate gpui-gfm directly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path("Cargo.toml")
          cargo_text = cargo.read_text()
          old_dep = 'gpui-component = { path = "third_party/gpui-component-gfm" }'
          new_dep = 'gpui-component = "0.4.2"\ngpui-gfm = { path = "third_party/gpui-gfm" }'
          if old_dep not in cargo_text:
              raise SystemExit("expected gpui-component bridge dependency not found")
          cargo.write_text(cargo_text.replace(old_dep, new_dep, 1))

          root = Path("src/ui/root.rs")
          text = root.read_text()

          old_import = '''use gpui_component::{
              notification::NotificationList,
              text::{TextView, TextViewStyle},
          };'''
          new_import = '''use gpui_component::notification::NotificationList;
          use gpui_gfm::{MarkdownCache, MarkdownRenderOptions, MarkdownTheme, render_markdown_cached};'''
          if old_import not in text:
              raise SystemExit("expected preview imports not found")
          text = text.replace(old_import, new_import, 1)

          old_fields = '''    /// Monotonic revision used to prevent an older hide timer from hiding a newer scroll event.
              preview_scroll_indicator_revision: u64,
          }'''
          new_fields = '''    /// Monotonic revision used to prevent an older hide timer from hiding a newer scroll event.
              preview_scroll_indicator_revision: u64,
              /// Persistent gpui-gfm state so selection and interactive Markdown survive re-renders.
              preview_markdown_options: MarkdownRenderOptions,
              /// Parsed Markdown cache reused by the preview across GPUI render passes.
              preview_markdown_cache: MarkdownCache,
          }'''
          if old_fields not in text:
              raise SystemExit("expected RootView preview fields not found")
          text = text.replace(old_fields, new_fields, 1)

          init_marker = "            preview_scroll_indicator_revision: 0,\n"
          init_replacement = init_marker + (
              "            preview_markdown_options: MarkdownRenderOptions::default(),\n"
              "            preview_markdown_cache: MarkdownCache::default(),\n"
          )
          if text.count(init_marker) != 1:
              raise SystemExit(f"expected one preview init marker, found {text.count(init_marker)}")
          text = text.replace(init_marker, init_replacement, 1)

          marker = "                        let show_preview_scroll_indicator = self.preview_scroll_indicator_visible;\n"
          insertion = marker + '''                        let markdown_theme = MarkdownTheme {
                              foreground: Theme::text().into(),
                              muted_foreground: Theme::muted().into(),
                              background: Theme::bg().into(),
                              code_background: Theme::code_block_bg().into(),
                              border: Theme::border().into(),
                              link: Theme::accent().into(),
                              accent: Theme::accent().into(),
                              code_font_family: "Menlo".into(),
                              is_dark: Theme::is_dark(),
                          };
                          let markdown_options = self
                              .preview_markdown_options
                              .clone()
                              .with_theme(markdown_theme);
                          let markdown_content = render_markdown_cached(
                              &doc_text,
                              &markdown_options,
                              &mut self.preview_markdown_cache,
                              cx,
                          );
          '''
          if text.count(marker) != 1:
              raise SystemExit(f"expected one preview block marker, found {text.count(marker)}")
          text = text.replace(marker, insertion, 1)

          start_marker = "TextView::markdown("
          end_marker = ".selectable(true)"
          if text.count(start_marker) != 1:
              raise SystemExit(f"expected one TextView::markdown call, found {text.count(start_marker)}")
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''div()
                                          .h_auto()
                                          .pl(px(32.))
                                          .pr(px(32.))
                                          .py(px(24.))
                                          .child(markdown_content)'''
          text = text[:start] + replacement + text[end:]

          root.write_text(text)
          PY

          rm -rf third_party/gpui-component-gfm
          rustfmt --edition 2024 src/ui/root.rs

      - name: Commit direct renderer integration
        run: |
          if [[ -n "$(git status --porcelain -- Cargo.toml src/ui/root.rs third_party/gpui-component-gfm)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml src/ui/root.rs third_party/gpui-component-gfm
            git commit -m "Integrate gpui-gfm preview directly"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Cargo check
        run: cargo check

      - name: Commit Cargo.lock
        if: success()
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Update Cargo.lock for gpui-gfm"
            git push origin HEAD:${{ github.head_ref }}
          fi
