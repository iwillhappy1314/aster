name: Agent Cargo Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cargo-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Inspect GPUI Font API
        run: |
          cargo fetch
          FONT_FILE=$(find "$CARGO_HOME/registry/src" -path '*/gpui-0.2.2/src/*.rs' -type f -print0 | xargs -0 grep -l 'pub struct Font' | head -1)
          echo "FONT_FILE=$FONT_FILE"
          grep -n -A30 -B5 'pub struct Font' "$FONT_FILE"

      - name: Cargo check
        run: cargo check
