name: Agent Precise Outline Reveal

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cargo-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Implement precise outline reveal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # gpui-gfm: expose top-level rendered blocks so the host ScrollHandle
          # can track each block's real layout bounds.
          blocks = Path("third_party/gpui-gfm/render/blocks.rs")
          text = blocks.read_text()
          if "pub(crate) fn render_top_level_blocks" not in text:
              marker = "/// Render a single block.\n"
              helper = '''/// Render top-level blocks individually so a host scroll container can track\n/// each block's real layout bounds. Returns rendered elements plus the direct-child\n/// indices corresponding to headings, in document heading order.\npub(crate) fn render_top_level_blocks(\n  blocks: &[Block],\n  options: &MarkdownRenderOptions,\n  cx: &App,\n) -> (Vec<AnyElement>, Vec<usize>) {\n  let mut elements = Vec::with_capacity(blocks.len());\n  let mut heading_child_indices = Vec::new();\n\n  for (ix, block) in blocks.iter().enumerate() {\n    let mut element = render_block(block, options, 0, cx);\n    if matches!(block, Block::Heading { .. }) {\n      heading_child_indices.push(ix);\n      if ix > 0 {\n        element = div().mt(px(10.0)).child(element).into_any_element();\n      }\n    }\n    elements.push(element);\n  }\n\n  (elements, heading_child_indices)\n}\n\n'''
              if marker not in text:
                  raise SystemExit("blocks.rs render_block marker not found")
              text = text.replace(marker, helper + marker, 1)
          blocks.write_text(text)

          render_mod = Path("third_party/gpui-gfm/render/mod.rs")
          text = render_mod.read_text()
          if "pub struct RenderedMarkdownBlocks" not in text:
              marker = "/// Render a markdown source string to a GPUI element.\n"
              api = '''/// Top-level rendered Markdown blocks for hosts that need per-block layout bounds.\npub struct RenderedMarkdownBlocks {\n  pub elements: Vec<AnyElement>,\n  /// Direct-child indices of top-level headings, in heading order.\n  pub heading_child_indices: Vec<usize>,\n}\n\n/// Render cached Markdown as individual top-level blocks.\n///\n/// This preserves the renderer's normal block styling while allowing the host's\n/// scroll container to track each block as a direct child.\npub fn render_markdown_blocks_cached(\n  source: &str,\n  options: &MarkdownRenderOptions,\n  cache: &mut crate::cache::MarkdownCache,\n  cx: &App,\n) -> RenderedMarkdownBlocks {\n  let parsed = cache.get_or_parse(source);\n  render_parsed_markdown_blocks(&parsed, options, cx)\n}\n\n/// Render a pre-parsed document as individual top-level blocks.\npub fn render_parsed_markdown_blocks(\n  parsed: &ParsedMarkdown,\n  options: &MarkdownRenderOptions,\n  cx: &App,\n) -> RenderedMarkdownBlocks {\n  options.details_state.reset_counter();\n  options.selection_state.reset_counter();\n  let (elements, heading_child_indices) =\n    blocks::render_top_level_blocks(parsed.blocks(), options, cx);\n  RenderedMarkdownBlocks {\n    elements,\n    heading_child_indices,\n  }\n}\n\n'''
              if marker not in text:
                  raise SystemExit("render/mod.rs API insertion marker not found")
              text = text.replace(marker, api + marker, 1)
          render_mod.write_text(text)

          lib = Path("third_party/gpui-gfm/lib.rs")
          text = lib.read_text()
          old = '''pub use render::{\n  DetailsState, ImageLoaderFn, ListItemView, MarkdownRenderOptions, MarkdownTheme, RenderOverrides,\n  render_markdown, render_markdown_cached, render_parsed_markdown,\n};'''
          new = '''pub use render::{\n  DetailsState, ImageLoaderFn, ListItemView, MarkdownRenderOptions, MarkdownTheme, RenderOverrides,\n  RenderedMarkdownBlocks, render_markdown, render_markdown_blocks_cached, render_markdown_cached,\n  render_parsed_markdown, render_parsed_markdown_blocks,\n};'''
          if old in text:
              text = text.replace(old, new, 1)
          elif "render_markdown_blocks_cached" not in text:
              raise SystemExit("gpui-gfm lib.rs re-export block not found")
          lib.write_text(text)

          # Editor: keep ordinary reveal/search behavior, but give Outline its own
          # top-aligned pending reveal using the real TextLayout position.
          editor = Path("src/ui/editor.rs")
          text = editor.read_text()
          field = '''    /// Byte offset that should be revealed after next layout.\n    pending_scroll_to_byte: Option<usize>,\n'''
          field_new = field + '''    /// Outline target that should be aligned near the top after layout.\n    pending_outline_reveal_byte: Option<usize>,\n'''
          if "pending_outline_reveal_byte" not in text:
              if field not in text:
                  raise SystemExit("editor pending scroll field not found")
              text = text.replace(field, field_new, 1)
              init = "            pending_scroll_to_byte: None,\n"
              if init not in text:
                  raise SystemExit("editor pending scroll init not found")
              text = text.replace(init, init + "            pending_outline_reveal_byte: None,\n", 1)

          reveal_cursor_end = '''        self.pending_scroll_to_byte = Some(byte);\n        cx.notify();\n    }\n'''
          if "pub fn reveal_outline" not in text:
              reveal_outline = reveal_cursor_end + '''\n    /// Aligns an Outline target to a stable top inset using its real text layout Y.\n    pub fn reveal_outline(&mut self, byte: usize, cx: &mut Context<Self>) {\n        self.pending_outline_reveal_byte = Some(byte);\n        cx.notify();\n    }\n'''
              if reveal_cursor_end not in text:
                  raise SystemExit("editor reveal_cursor end not found")
              text = text.replace(reveal_cursor_end, reveal_outline, 1)

          start = text.find("    fn reveal_pending_byte(\n")
          end = text.find("\n}\n\nimpl Focusable for EditorView", start)
          if start < 0 or end < 0:
              raise SystemExit("editor reveal_pending_byte boundaries not found")
          new_reveal = '''    fn reveal_pending_byte(\n        &mut self,\n        text_layout: &gpui::TextLayout,\n        projection: &DisplayProjection,\n        window: &mut Window,\n    ) {\n        let (target_source_byte, align_to_top) =\n            if let Some(byte) = self.pending_outline_reveal_byte {\n                (byte, true)\n            } else if let Some(byte) = self.pending_scroll_to_byte {\n                (byte, false)\n            } else {\n                return;\n            };\n        let target_display_byte = projection.source_to_display_byte(target_source_byte);\n\n        let Some(target_pos) = std::panic::catch_unwind(AssertUnwindSafe(|| {\n            text_layout.position_for_index(target_display_byte)\n        }))\n        .ok()\n        .flatten() else {\n            return;\n        };\n\n        let line_height = std::panic::catch_unwind(AssertUnwindSafe(|| text_layout.line_height()))\n            .ok()\n            .unwrap_or(px(0.));\n        if line_height <= px(0.) {\n            return;\n        }\n\n        let max = self.scroll_handle.max_offset();\n        let offset = self.scroll_handle.offset();\n        let bounds = self.scroll_handle.bounds();\n        let viewport_height = bounds.size.height;\n        if viewport_height <= px(0.) {\n            return;\n        }\n\n        let target_top = target_pos.y;\n        let mut new_offset_y = if align_to_top {\n            -(target_top - px(24.))\n        } else {\n            let padding = px(28.);\n            let visible_top = -offset.y;\n            let visible_bottom = visible_top + viewport_height;\n            let target_bottom = target_top + line_height;\n            let mut minimal_offset = offset.y;\n            if target_top < visible_top + padding {\n                minimal_offset = -(target_top - padding);\n            } else if target_bottom > visible_bottom - padding {\n                minimal_offset = -(target_bottom - viewport_height + padding);\n            }\n            minimal_offset\n        };\n\n        new_offset_y = new_offset_y.clamp(-max.height, px(0.));\n        self.scroll_handle.set_offset(point(offset.x, new_offset_y));\n        if align_to_top {\n            self.pending_outline_reveal_byte = None;\n        } else {\n            self.pending_scroll_to_byte = None;\n        }\n        window.refresh();\n    }\n'''
          text = text[:start] + new_reveal + text[end:]
          editor.write_text(text)

          # Outline callback now supplies both heading ordinal and source byte.
          explorer = Path("src/ui/file_explorer.rs")
          text = explorer.read_text()
          text = text.replace(
              "pub type RevealCallback = Arc<dyn Fn(usize, &mut App)>;",
              "pub type RevealCallback = Arc<dyn Fn(usize, usize, &mut App)>;",
              1,
          )
          text = text.replace("on_reveal(byte_start, cx);", "on_reveal(ordinal, byte_start, cx);", 1)
          explorer.write_text(text)

          # Root: use direct rendered blocks and ScrollHandle's real child bounds.
          root = Path("src/ui/root.rs")
          text = root.read_text()
          text = text.replace(
              "use gpui_gfm::{MarkdownCache, MarkdownRenderOptions, MarkdownTheme, render_markdown_cached};",
              "use gpui_gfm::{MarkdownCache, MarkdownRenderOptions, MarkdownTheme, render_markdown_blocks_cached};",
              1,
          )

          cache_field = '''    /// Parsed Markdown cache reused by the preview across GPUI render passes.\n    preview_markdown_cache: MarkdownCache,\n'''
          if "preview_heading_child_indices" not in text:
              if cache_field not in text:
                  raise SystemExit("root preview cache field not found")
              text = text.replace(
                  cache_field,
                  cache_field + '''    /// Direct preview child indices for headings, in Outline order.\n    preview_heading_child_indices: std::sync::Arc<std::sync::Mutex<Vec<usize>>>,\n''',
                  1,
              )
              init = "            preview_markdown_cache: MarkdownCache::default(),\n"
              if init not in text:
                  raise SystemExit("root preview cache init not found")
              text = text.replace(
                  init,
                  init + "            preview_heading_child_indices: Default::default(),\n",
                  1,
              )

          callback_start = text.find("        // Install the outline-click reveal callback once.")
          callback_end = text.find("\n        let (doc_path, doc_dirty, doc_revision) = {", callback_start)
          if callback_start < 0 or callback_end < 0:
              raise SystemExit("root outline callback boundaries not found")
          callback_block = '''        // Install the Outline reveal callback once. The editor uses TextLayout's\n        // exact Y position; preview uses ScrollHandle's real direct-child bounds.\n        if !self.outline_reveal_installed {\n            self.outline_reveal_installed = true;\n            let editor = self.editor_view.clone();\n            let preview_scroll = self.preview_scroll_handle.clone();\n            let preview_heading_indices = self.preview_heading_child_indices.clone();\n            let callback: crate::ui::file_explorer::RevealCallback =\n                std::sync::Arc::new(move |heading_ordinal, byte_start, cx: &mut App| {\n                    let _ = editor.update(cx, |editor, cx| {\n                        editor.reveal_outline(byte_start, cx)\n                    });\n\n                    let child_index = preview_heading_indices\n                        .lock()\n                        .ok()\n                        .and_then(|indices| indices.get(heading_ordinal).copied());\n                    if let Some(child_index) = child_index {\n                        if let Some(child_bounds) = preview_scroll.bounds_for_item(child_index) {\n                            let viewport = preview_scroll.bounds();\n                            let max = preview_scroll.max_offset();\n                            let current = preview_scroll.offset();\n                            let mut next = current;\n                            next.y = (viewport.top() + px(24.) - child_bounds.top())\n                                .clamp(-max.height, px(0.));\n                            preview_scroll.set_offset(next);\n                        } else {\n                            preview_scroll.scroll_to_top_of_item(child_index);\n                        }\n                    }\n                });\n            let _ = self\n                .file_explorer_view\n                .update(cx, |view, _| view.set_on_reveal(callback));\n        }\n'''
          text = text[:callback_start] + callback_block + text[callback_end:]

          old_render = '''                        let markdown_content = render_markdown_cached(\n                            &doc_text,\n                            &markdown_options,\n                            &mut self.preview_markdown_cache,\n                            cx,\n                        );'''
          new_render = '''                        let markdown_blocks = render_markdown_blocks_cached(\n                            &doc_text,\n                            &markdown_options,\n                            &mut self.preview_markdown_cache,\n                            cx,\n                        );\n                        if let Ok(mut indices) = self.preview_heading_child_indices.lock() {\n                            *indices = markdown_blocks.heading_child_indices.clone();\n                        }'''
          if old_render not in text:
              raise SystemExit("root markdown render call not found")
          text = text.replace(old_render, new_render, 1)

          old_scroll = '''                                div()\n                                    .id("preview-scroll")\n                                    .size_full()\n                                    .overflow_y_scroll()\n                                    .overflow_x_hidden()\n                                    .track_scroll(&self.preview_scroll_handle)\n                                    .on_scroll_wheel(cx.listener(\n                                        |this, _: &gpui::ScrollWheelEvent, _, cx| {\n                                            this.reveal_preview_scroll_indicator(cx);\n                                        },\n                                    ))\n                                    .child(\n                                        div()\n                                            .h_auto()\n                                            .pl(px(32.))\n                                            .pr(px(32.))\n                                            .py(px(24.))\n                                            .child(markdown_content),\n                                    ),'''
          new_scroll = '''                                div()\n                                    .id("preview-scroll")\n                                    .size_full()\n                                    .flex()\n                                    .flex_col()\n                                    .gap_2()\n                                    .pl(px(32.))\n                                    .pr(px(32.))\n                                    .py(px(24.))\n                                    .overflow_y_scroll()\n                                    .overflow_x_hidden()\n                                    .track_scroll(&self.preview_scroll_handle)\n                                    .on_scroll_wheel(cx.listener(\n                                        |this, _: &gpui::ScrollWheelEvent, _, cx| {\n                                            this.reveal_preview_scroll_indicator(cx);\n                                        },\n                                    ))\n                                    .children(markdown_blocks.elements),'''
          if old_scroll not in text:
              raise SystemExit("root preview scroll block not found")
          text = text.replace(old_scroll, new_scroll, 1)
          root.write_text(text)
          PY

          rustfmt --edition 2024 \
            src/ui/editor.rs \
            src/ui/file_explorer.rs \
            src/ui/root.rs \
            third_party/gpui-gfm/lib.rs \
            third_party/gpui-gfm/render/mod.rs \
            third_party/gpui-gfm/render/blocks.rs

      - name: Cargo check
        run: cargo check

      - name: Commit precise Outline reveal
        if: success()
        run: |
          if [[ -n "$(git status --porcelain -- src/ui third_party/gpui-gfm)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/ui/editor.rs src/ui/file_explorer.rs src/ui/root.rs \
              third_party/gpui-gfm/lib.rs third_party/gpui-gfm/render/mod.rs \
              third_party/gpui-gfm/render/blocks.rs
            git commit -m "Improve Outline reveal precision"
            git push origin HEAD:${{ github.head_ref }}
          fi
