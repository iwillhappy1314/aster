name: Validate editor outline sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/editor-outline-active-sync
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply editor Outline sync patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/ui/editor.rs")
          text = path.read_text()

          old = "const CARET_WIDTH: f32 = 2.0;\n"
          new = "const CARET_WIDTH: f32 = 2.0;\n\npub type OutlineViewportCallback = Arc<dyn Fn(usize, &mut App)>;\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = "    /// Outline target that should be aligned near the top after layout.\n    pending_outline_reveal_byte: Option<usize>,\n}"
          new = "    /// Outline target that should be aligned near the top after layout.\n    pending_outline_reveal_byte: Option<usize>,\n    /// Reports the source byte crossing the editor viewport activation line.\n    on_outline_viewport_change: Option<OutlineViewportCallback>,\n    /// Last viewport position reported, keyed by document revision.\n    last_outline_viewport_report: Option<(u64, usize)>,\n}"
          assert old in text
          text = text.replace(old, new, 1)

          old = "            pending_scroll_to_byte: None,\n            pending_outline_reveal_byte: None,\n        }"
          new = "            pending_scroll_to_byte: None,\n            pending_outline_reveal_byte: None,\n            on_outline_viewport_change: None,\n            last_outline_viewport_report: None,\n        }"
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    /// Aligns an Outline target to a stable top inset using its real text layout Y.\n    pub fn reveal_outline(&mut self, byte: usize, cx: &mut Context<Self>) {\n        self.pending_scroll_to_byte = None;\n        self.pending_outline_reveal_byte = Some(byte);\n        cx.notify();\n    }\n\n'''
          new = '''    /// Aligns an Outline target to a stable top inset using its real text layout Y.\n    pub fn reveal_outline(&mut self, byte: usize, cx: &mut Context<Self>) {\n        self.pending_scroll_to_byte = None;\n        self.pending_outline_reveal_byte = Some(byte);\n        cx.notify();\n    }\n\n    pub fn set_on_outline_viewport_change(&mut self, callback: OutlineViewportCallback) {\n        self.on_outline_viewport_change = Some(callback);\n        self.last_outline_viewport_report = None;\n    }\n\n    fn sync_outline_viewport(\n        &mut self,\n        text_layout: &gpui::TextLayout,\n        projection: &DisplayProjection,\n        doc_revision: u64,\n        cx: &mut Context<Self>,\n    ) {\n        let Some(callback) = self.on_outline_viewport_change.clone() else {\n            return;\n        };\n\n        let viewport = self.scroll_handle.bounds();\n        if viewport.size.height <= px(0.) {\n            return;\n        }\n\n        let activation_point = point(viewport.left() + px(32.), viewport.top() + px(32.));\n        let display_byte = std::panic::catch_unwind(AssertUnwindSafe(|| {\n            text_layout.index_for_position(activation_point)\n        }))\n        .ok()\n        .map(|result| match result {\n            Ok(index) => index,\n            Err(index) => index,\n        });\n        let Some(display_byte) = display_byte else {\n            return;\n        };\n\n        let source_byte = projection.display_to_source_byte(display_byte);\n        let report = (doc_revision, source_byte);\n        if self.last_outline_viewport_report == Some(report) {\n            return;\n        }\n\n        self.last_outline_viewport_report = Some(report);\n        callback(source_byte, cx);\n    }\n\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = "        let text_layout = styled.layout().clone();\n        self.reveal_pending_byte(&text_layout, projection.as_ref(), window);\n        let has_multiple_lines = text_owned.lines().nth(1).is_some();"
          new = "        let text_layout = styled.layout().clone();\n        let had_pending_reveal =\n            self.pending_outline_reveal_byte.is_some() || self.pending_scroll_to_byte.is_some();\n        self.reveal_pending_byte(&text_layout, projection.as_ref(), window);\n        if !had_pending_reveal {\n            self.sync_outline_viewport(\n                &text_layout,\n                projection.as_ref(),\n                doc_revision,\n                cx,\n            );\n        }\n        let has_multiple_lines = text_owned.lines().nth(1).is_some();"
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path("src/ui/file_explorer.rs")
          text = path.read_text()

          old = '''    pub fn set_active_outline(&mut self, ordinal: Option<usize>, cx: &mut Context<Self>) {\n        if self.active_outline_ordinal != ordinal {\n            self.active_outline_ordinal = ordinal;\n            cx.notify();\n        }\n    }\n\n'''
          new = '''    pub fn set_active_outline(&mut self, ordinal: Option<usize>, cx: &mut Context<Self>) {\n        if self.active_outline_ordinal != ordinal {\n            self.active_outline_ordinal = ordinal;\n            cx.notify();\n        }\n    }\n\n    pub fn set_active_outline_for_byte(&mut self, byte: usize, cx: &mut Context<Self>) {\n        let doc_revision = self.document.read(cx).revision;\n        let outline_items = if let Some((cached_revision, items)) = &self.cached_outline {\n            if *cached_revision == doc_revision {\n                items.clone()\n            } else {\n                let text = self.document.read(cx).text();\n                let parsed = parse_outline_items(&text);\n                self.cached_outline = Some((doc_revision, parsed.clone()));\n                parsed\n            }\n        } else {\n            let text = self.document.read(cx).text();\n            let parsed = parse_outline_items(&text);\n            self.cached_outline = Some((doc_revision, parsed.clone()));\n            parsed\n        };\n\n        self.set_active_outline(active_outline_ordinal(&outline_items, byte), cx);\n    }\n\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = "fn heading_level_number(level: HeadingLevel) -> u32 {"
          new = '''fn active_outline_ordinal(items: &[OutlineItem], byte: usize) -> Option<usize> {\n    if items.is_empty() {\n        return None;\n    }\n\n    Some(\n        items\n            .iter()\n            .rposition(|item| item.byte_start <= byte)\n            .unwrap_or(0),\n    )\n}\n\nfn heading_level_number(level: HeadingLevel) -> u32 {'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    #[test]\n    fn ignores_heading_like_lines_inside_fenced_code() {'''
          new = '''    #[test]\n    fn active_outline_follows_last_heading_before_viewport_byte() {\n        let text = "# Top\\n\\nbody\\n\\n## Child\\n\\nmore\\n\\n### Leaf\\n";\n        let items = parse_outline_items(text);\n        let child = text.find("## Child").unwrap();\n        let leaf = text.find("### Leaf").unwrap();\n\n        assert_eq!(active_outline_ordinal(&items, 0), Some(0));\n        assert_eq!(active_outline_ordinal(&items, child - 1), Some(0));\n        assert_eq!(active_outline_ordinal(&items, child), Some(1));\n        assert_eq!(active_outline_ordinal(&items, leaf), Some(2));\n    }\n\n    #[test]\n    fn ignores_heading_like_lines_inside_fenced_code() {'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path("src/ui/root.rs")
          text = path.read_text()
          old = '''            let _ = self\n                .file_explorer_view\n                .update(cx, |view, _| view.set_on_reveal(callback));\n        }\n'''
          new = '''            let _ = self\n                .file_explorer_view\n                .update(cx, |view, _| view.set_on_reveal(callback));\n\n            let file_explorer = self.file_explorer_view.clone();\n            let viewport_callback: crate::ui::editor::OutlineViewportCallback =\n                std::sync::Arc::new(move |byte_start, cx: &mut App| {\n                    let _ = file_explorer.update(cx, |view, cx| {\n                        view.set_active_outline_for_byte(byte_start, cx);\n                    });\n                });\n            let _ = self.editor_view.update(cx, |view, _| {\n                view.set_on_outline_viewport_change(viewport_callback);\n            });\n        }\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Format
        run: cargo fmt --all

      - name: Test Outline helpers
        run: cargo test ui::file_explorer::tests --bin Aster

      - name: Cargo check
        run: cargo check

      - name: Commit validated changes and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/editor-outline-sync-check.yml
          rm -f .github/workflows/editor-outline-pr-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: sync Outline while scrolling editor"
          git push origin HEAD:agent/editor-outline-active-sync
