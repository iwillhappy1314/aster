name: Agent Outline Anchor Fix

on:
  push:
    branches:
      - agent/fix-multilevel-outline-reveal
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-check:
    if: ${{ !contains(github.event.head_commit.message || '', '[outline-anchor-patched]') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-multilevel-outline-reveal

      - name: Patch editor outline reveal offset
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/ui/editor.rs')
          text = path.read_text()
          old = '''        let target_top = target_pos.y;
        let mut new_offset_y = if align_to_top {
            // The editor scroll container already has 24px top padding, so
            // offsetting by the text-layout Y leaves the heading at that inset.
            -target_top
        } else {'''
          new = '''        let target_top = target_pos.y;
        let mut new_offset_y = if align_to_top {
            // TextLayout positions already include the current scroll translation.
            // Apply only the delta needed to place the heading at the editor's
            // stable 24px content inset instead of replacing the whole offset.
            let desired_top = bounds.top() + px(24.);
            offset.y + (desired_top - target_top)
        } else {'''
          if old not in text:
              raise SystemExit('expected reveal_outline snippet not found')
          path.write_text(text.replace(old, new, 1))

      - name: Format
        run: cargo fmt -- src/ui/editor.rs

      - name: Check
        run: cargo check

      - name: Commit patch
        if: github.event_name == 'push'
        run: |
          git config user.name "Aster Agent"
          git config user.email "actions@users.noreply.github.com"
          git add src/ui/editor.rs
          git commit -m "Fix accumulated Outline anchor offset [outline-anchor-patched]"
          git push
