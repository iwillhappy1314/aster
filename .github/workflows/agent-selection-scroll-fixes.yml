#[derive(Clone, Debug)]
pub struct ActiveSelection {
  /// Text block containing the fixed selection anchor.
  pub anchor_text_id: usize,
  /// Byte offset of the anchor inside `anchor_text_id`.
  pub anchor: usize,
  /// Text block containing the moving selection head.
  pub head_text_id: usize,
  /// Byte offset of the head inside `head_text_id`.
  pub head: usize,
  /// Whether the user is currently dragging.
  pub dragging: bool,
  /// Selection granularity (char / word / line).
  pub mode: SelectionMode,
  /// The initially-selected range from the click point (word or line range).
  /// This range belongs to `anchor_text_id`.
  pub initial_range: Option<std::ops::Range<usize>>,
}

/// Persistent state for text selection across all rendered text blocks.
///
/// Text block IDs are assigned in document order, so an anchor and head can
/// describe one continuous selection even when they live in different blocks.
#[derive(Clone, Default)]
pub struct SelectionState {
  selection: Arc<Mutex<Option<ActiveSelection>>>,
  counter: Arc<AtomicUsize>,
  selection_color: Arc<Mutex<Option<Hsla>>>,
  /// Text content registered for the current render pass, indexed by text ID.
  texts: Arc<Mutex<Vec<SharedString>>>,
}

impl SelectionState {
  /// Reset text-block IDs before a render pass while retaining the selection.
  pub fn reset_counter(&self) {
    self.counter.store(0, Ordering::Relaxed);
    self.texts.lock().unwrap().clear();
  }

  pub fn next_text_id(&self) -> usize {
    self.counter.fetch_add(1, Ordering::Relaxed)
  }

  /// Register text for cross-block clipboard extraction.
  pub fn register_text(&self, text_id: usize, text: SharedString) {
    let mut texts = self.texts.lock().unwrap();
    while texts.len() < text_id {
      texts.push(SharedString::new_static(""));
    }
    if text_id == texts.len() {
      texts.push(text);
    } else {
      texts[text_id] = text;
    }
  }

  pub fn set_selection_color(&self, color: Hsla) {
    *self.selection_color.lock().unwrap() = Some(color);
  }

  pub fn selection_color(&self) -> Hsla {
    self.selection_color.lock().unwrap().unwrap_or(Hsla {
      h: 0.58,
      s: 0.6,
      l: 0.5,
      a: 0.3,
    })
  }

  /// Update selection endpoints while preserving mode metadata.
  pub fn update(
    &self,
    anchor_text_id: usize,
    anchor: usize,
    head_text_id: usize,
    head: usize,
    dragging: bool,
  ) {
    let mut sel = self.selection.lock().unwrap();
    let (mode, initial_range) = sel
      .as_ref()
      .filter(|s| s.anchor_text_id == anchor_text_id)
      .map(|s| (s.mode, s.initial_range.clone()))
      .unwrap_or((SelectionMode::Char, None));
    *sel = Some(ActiveSelection {
      anchor_text_id,
      anchor,
      head_text_id,
      head,
      dragging,
      mode,
      initial_range,
    });
  }

  pub fn update_with_mode(
    &self,
    anchor_text_id: usize,
    anchor: usize,
    head_text_id: usize,
    head: usize,
    dragging: bool,
    mode: SelectionMode,
    initial_range: Option<std::ops::Range<usize>>,
  ) {
    *self.selection.lock().unwrap() = Some(ActiveSelection {
      anchor_text_id,
      anchor,
      head_text_id,
      head,
      dragging,
      mode,
      initial_range,
    });
  }

  pub fn clear(&self) {
    *self.selection.lock().unwrap() = None;
  }

  /// Return the active selection regardless of which block owns the mouse.
  pub fn active_selection(&self) -> Option<ActiveSelection> {
    self.selection.lock().unwrap().clone()
  }

  /// Return the active selection when it intersects this text block.
  pub fn selection_for(&self, text_id: usize) -> Option<ActiveSelection> {
    let active = self.active_selection()?;
    let min_id = active.anchor_text_id.min(active.head_text_id);
    let max_id = active.anchor_text_id.max(active.head_text_id);
    (text_id >= min_id && text_id <= max_id).then_some(active)
  }

  pub fn is_dragging(&self) -> bool {
    self
      .selection
      .lock()
      .unwrap()
      .as_ref()
      .is_some_and(|s| s.dragging)
  }

  /// Get the local byte range selected inside one rendered text block.
  pub fn selection_range_for(&self, text_id: usize, text: &str) -> Option<std::ops::Range<usize>> {
    let active = self.active_selection()?;
    local_selection_range(&active, text_id, text)
  }

  /// Extract the complete selection across all registered text blocks.
  pub fn selected_text(&self) -> Option<String> {
    let active = self.active_selection()?;
    if active.anchor_text_id == active.head_text_id && active.anchor == active.head {
      return None;
    }

    let texts = self.texts.lock().unwrap();
    let start_id = active.anchor_text_id.min(active.head_text_id);
    let end_id = active.anchor_text_id.max(active.head_text_id);
    if start_id >= texts.len() || end_id >= texts.len() {
      return None;
    }

    let mut parts = Vec::new();
    for text_id in start_id..=end_id {
      let text = texts[text_id].as_ref();
      if let Some(range) = local_selection_range(&active, text_id, text) {
        if let Some(slice) = text.get(range) {
          parts.push(slice.to_string());
        }
      }
    }

    if parts.is_empty() { None } else { Some(parts.join("\n")) }
  }
}

fn local_selection_range(
  active: &ActiveSelection,
  text_id: usize,
  text: &str,
) -> Option<std::ops::Range<usize>> {
  let anchor_point = (active.anchor_text_id, active.anchor);
  let head_point = (active.head_text_id, active.head);
  if anchor_point == head_point {
    return None;
  }

  let ((start_id, start_offset), (end_id, end_offset)) = if anchor_point <= head_point {
    (anchor_point, head_point)
  } else {
    (head_point, anchor_point)
  };

  if text_id < start_id || text_id > end_id {
    return None;
  }

  let text_len = text.len();
  let (start, end) = if start_id == end_id {
    (
      clamp_to_char_boundary(text, start_offset.min(text_len)),
      clamp_to_char_boundary(text, end_offset.min(text_len)),
    )
  } else if text_id == start_id {
    (clamp_to_char_boundary(text, start_offset.min(text_len)), text_len)
  } else if text_id == end_id {
    (0, clamp_to_char_boundary(text, end_offset.min(text_len)))
  } else {
    (0, text_len)
  };

  (start < end).then_some(start..end)
}
