fn selection_endpoints_for_index(
  active: &super::ActiveSelection,
  current_text_id: usize,
  index: usize,
  current_text: &str,
) -> (usize, usize, usize, usize) {
  match active.mode {
    SelectionMode::Word => {
      let initial = active.initial_range.as_ref().expect("word selection needs initial range");
      let current = word_range_at(current_text, index);
      let before_anchor = current_text_id < active.anchor_text_id
        || (current_text_id == active.anchor_text_id && index < initial.start);
      if before_anchor {
        (active.anchor_text_id, initial.end, current_text_id, current.start)
      } else {
        (active.anchor_text_id, initial.start, current_text_id, current.end)
      }
    }
    SelectionMode::Line => {
      let initial = active.initial_range.as_ref().expect("line selection needs initial range");
      let current = line_range_at(current_text, index);
      let before_anchor = current_text_id < active.anchor_text_id
        || (current_text_id == active.anchor_text_id && index < initial.start);
      if before_anchor {
        (active.anchor_text_id, initial.end, current_text_id, current.start)
      } else {
        (active.anchor_text_id, initial.start, current_text_id, current.end)
      }
    }
    SelectionMode::Char => (
      active.anchor_text_id,
      active.anchor,
      current_text_id,
      index,
    ),
  }
}
