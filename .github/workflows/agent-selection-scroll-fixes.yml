        let len = self.len_chars();
        let anchor = anchor.min(len);
        let head = head.min(len);
        let (start, end) = if anchor <= head {
            (anchor, head)
        } else {
            (head, anchor)
        };
        self.selection = if start == end {
            None
        } else {
            Some(start..end)
        };
        // Keep selection direction separate from the normalised storage range.
        // This lets drag/Shift selection extend naturally in either direction.
        self.cursor = head;
        self.selection_anchor = Some(anchor);
    }
