        let (start, end) = if start <= end {
            (start, end)
        } else {
            (end, start)
        };
        self.selection = if start == end {
            None
        } else {
            Some(start.min(self.len_chars())..end.min(self.len_chars()))
        };
        self.cursor = end.min(self.len_chars());
        self.selection_anchor = Some(start.min(self.len_chars()));
    }
