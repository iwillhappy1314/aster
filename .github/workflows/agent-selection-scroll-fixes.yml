  #[test]
  fn selection_state_same_block_range() {
    let state = SelectionState::default();
    state.update(0, 2, 0, 5, false);
    assert_eq!(state.selection_range_for(0, "hello world"), Some(2..5));
    state.update(0, 5, 0, 2, false);
    assert_eq!(state.selection_range_for(0, "hello world"), Some(2..5));
  }

  #[test]
  fn selection_state_crosses_blocks_forward() {
    let state = SelectionState::default();
    state.register_text(0, "first".into());
    state.register_text(1, "middle".into());
    state.register_text(2, "last".into());
    state.update(0, 2, 2, 3, false);

